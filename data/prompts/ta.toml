# Samajh bot lines, Tamil. NOT HUMAN-REVIEWED: written by the build agent, with no fluent
# reader yet. Data, not code: samajh/dialogue/prompts.py loads and checks this file.
# Slots: {first_name}, {lender}, {ordinal}; the read_back.* lines also take {amount_words} and
# {amount_digits}, which carry the figure the customer said, never a figure from the record.
# `design` names the DESIGN.md paragraph the line implements.

# Call v2 (iteration 2, P2): new lines are plain best-effort wording, not human-reviewed.

language = "ta"
review = "not human-reviewed"
ordinals = ["முதல்", "இரண்டாவது", "மூன்றாவது", "நான்காவது", "ஐந்தாவது"]
range_word = "முதல்"

[lines."right_party.ask"]
design = "§5 step 1: confirm the first name; nothing else is said yet"
text = "வணக்கம். நான் {first_name} அவர்களிடம் பேசுகிறேனா?"

[lines."right_party.reask"]
design = "§5 step 1 and the one-re-ask rule: asks whether the speaker is the borrower, not whether he is there; no lender, no loan"
text = "இது {first_name} அவர்களுக்கான ஒரு தானியங்கி வாடிக்கையாளர் சேவை அழைப்பு. நீங்களே {first_name} அவர்களா?"

[lines."right_party.who_check"]
design = "§5 step 1 applied mid-call (iteration 3): after a sign of another speaker, a choice question (the borrower, or someone in their place); a bare yes does not answer it; no lender, no loan. Not human-reviewed."
text = "மன்னிக்கவும், யாரிடம் பேசுகிறேன் என்பதை உறுதிப்படுத்த வேண்டும். நீங்களே {first_name} அவர்களா, அல்லது அவர்களுக்குப் பதிலாக வேறு யாராவதா?"

[lines."purpose.before_confirm"]
design = "§5 step 1: 'what is this about?' before anyone has claimed to be the borrower; no lender, no loan"
text = "இது ஒரு வாடிக்கையாளர் சேவை கருத்துக் கேட்பு அழைப்பு; சரியான நபர் என்று உறுதியானதும் மேலும் சொல்கிறோம்."

[lines."disclosure.who"]
design = "§5 step 2: the bank's name, customer-care team, automated AI assistant (recommended: FREE-AI report para 4.4.54)"
text = "நன்றி. இந்த அழைப்பு {lender} வாடிக்கையாளர் சேவைக் குழுவிடமிருந்து வருகிறது. நான் ஒரு தானியங்கி ஏ-ஐ உதவியாளர், மனிதர் அல்ல."

[lines."disclosure.not_sales"]
design = "§5 step 2: not a sales call, nothing will be offered (TCCCPR: promotional content would make it a promotional call)"
text = "இது விற்பனை அழைப்பு அல்ல. இந்த அழைப்பில் உங்களுக்கு எதுவும் விற்கப்படாது."

[lines."disclosure.recording"]
design = "§5 step 2: feedback purpose, recorded to keep an accurate record (our choice), written notice (DPDP Act sections 5 and 6)"
text = "இது உங்கள் கருத்தைக் கேட்பதற்கான அழைப்பு மட்டுமே. உங்கள் கருத்து சரியாகப் பதிவாக இருக்க, இந்த அழைப்பு பதிவு செய்யப்படுகிறது. உங்கள் தகவல் எப்படிப் பயன்படுத்தப்படும் என்பது {lender} எழுத்துப்பூர்வ அறிவிப்பில் உள்ளது."

[lines."disclosure.go_ahead"]
design = "§5 step 2: the customer can decline, so the bot asks before going on"
text = "தொடரலாமா?"

[lines."disclosure.reask"]
design = "§5 step 2 and the one-re-ask rule (§5, A20)"
text = "இது {lender} வாடிக்கையாளர் சேவைக் குழுவின் தானியங்கி கருத்துக் கேட்பு அழைப்பு, விற்பனை அழைப்பு அல்ல. தொடரலாமா? ஆம் அல்லது இல்லை என்று சொல்லுங்கள்."

[lines."disclosure.never_ask"]
design = "§5 step 2: the bot will never ask for an OTP, PIN, password or account number"
text = "இந்த அழைப்பில் உங்களிடம் ஓ-டி-பி, பின், கடவுச்சொல் அல்லது கணக்கு எண் ஒருபோதும் கேட்கப்படாது."

[lines."disclosure.rights"]
design = "§5 step 2: the customer can decline, stop at any time, or ask for a human"
text = "நீங்கள் விரும்பினால் மறுக்கலாம், எப்போது வேண்டுமானாலும் அழைப்பை நிறுத்தலாம், அல்லது ஒரு மனிதரிடம் பேச வேண்டும் என்று கேட்கலாம்."

[lines."verify.before_loan"]
design = "§5 step 2: how to check the call is genuine, on request before the loan is named; never names the loan"
text = "இந்த அழைப்பு {lender} வாடிக்கையாளர் சேவையிலிருந்து. சந்தேகம் இருந்தால், போனை வைத்துவிட்டு {lender} வாடிக்கையாளர் சேவை எண்ணுக்கு நீங்களே அழைத்துக் கேளுங்கள். நாங்கள் ஒருபோதும் ஓடிபி அல்லது பின் கேட்க மாட்டோம்."

[lines."verify.after_loan"]
design = "§5 step 2: how to check the call is genuine, on request after the loan is named"
text = "இந்த அழைப்பு {lender} வாடிக்கையாளர் சேவையிலிருந்து. சந்தேகம் இருந்தால், போனை வைத்துவிட்டு உங்கள் கடன் ஆவணங்களில் அச்சிடப்பட்ட வாடிக்கையாளர் சேவை எண்ணுக்கு அழைக்கலாம். நாங்கள் ஒருபோதும் ஓடிபி அல்லது பின் கேட்க மாட்டோம்."

[lines."verify.short"]
design = "§5 step 2: one short line on checking the call, said with the birth-year question (review round 2); with no second check (P8), with the disclosure; dropped when the lender turns the call-back line off"
text = "சந்தேகம் இருந்தால், போனை வைத்துவிட்டு {lender} வாடிக்கையாளர் சேவைக்கு நீங்களே அழைக்கலாம்."

[lines."second_check.ask"]
design = "§5 step 3: one low-sensitivity fact, the year of birth; never account digits"
text = "நன்றி. உறுதிப்படுத்த, நீங்கள் பிறந்த வருடத்தை மட்டும் சொல்லுங்கள். முழு தேதி வேண்டாம்."

[lines."second_check.reask"]
design = "§5 step 3 and the one-re-ask rule; the same line whether the year was unclear or did not match, and it claims neither"
text = "நீங்கள் பிறந்த வருடத்தை மட்டும் இன்னொரு முறை சொல்லுங்கள்."

[lines."context.loan"]
design = "§5 step 4: only now does the bot mention the loan"
text = "நன்றி. நீங்கள் சமீபத்தில் {lender} இடம் வாங்கிய கடன் பற்றியது இந்த அழைப்பு."

[lines."open_recall.ask"]
design = "§5 step 5: open recall before any product is named"
text = "கடனுடன் சேர்த்து வேறு என்னென்ன வாங்கினீர்கள், எவ்வளவு தொகைக்கு? உங்கள் சொந்த வார்த்தைகளில் சொல்லுங்கள்."

[lines."open_recall.reask"]
design = "§5 step 5 and the one-re-ask rule: simpler words, still no product named"
text = "அதாவது, கடன் வாங்கும்போது அதனுடன் வேறு ஏதாவது உங்களுக்குக் கொடுக்கப்பட்டதா? நினைவில் இருப்பதைச் சொல்லுங்கள்."

[lines."open_recall.nothing"]
design = "§5 step 5: the customer said they took nothing; one neutral follow-up, then consent and close"
text = "சரி. கடன் வாங்கும்போது, கடனைத் தவிர வேறு ஏதாவது பற்றி யாராவது உங்களிடம் பேசினார்களா?"

[lines."ack.neutral"]
design = "product review gain 8: the neutral acknowledgement is spoken in Hindi and Hinglish calls only; this line is kept so the file loads and is never said. Not human-reviewed."
text = "ம்."

[lines."teach_back.intro"]
design = "§5 step 6: the product is referred to without naming what it is"
text = "நன்றி. இப்போது கடனுடன் வாங்கிய பொருளைப் பற்றி சில சிறிய கேள்விகள்."

[lines."teach_back.intro_nth"]
design = "§5 step 6, for a record with several products: an ordinal, not a name"
text = "இப்போது கடனுடன் பதிவாகியுள்ள {ordinal} பொருளைப் பற்றி சில சிறிய கேள்விகள்."

[lines."kind.ask"]
design = "§5 step 6 'Is this insurance, FD or something else?', asked open so no kind is suggested"
text = "உங்கள் புரிதலில் அது என்ன?"

[lines."kind.reask"]
design = "§5 step 6 and the one-re-ask rule"
text = "அதாவது, கடனுடன் உங்களுக்குக் கிடைத்த அந்தப் பொருளை நீங்கள் என்னவென்று சொல்வீர்கள்?"

[lines."kind.ask_named"]
design = "§5 step 6, product review gain 8: the kind question when the customer already named something at open recall; refers to it without echoing the customer's word or suggesting a kind. Not human-reviewed."
text = "நீங்கள் சொன்னதைக் கொஞ்சம் விளக்குங்கள்: அது என்ன, எதற்குப் பயன்படும்?"

[lines."premium.ask"]
design = "§5 step 6 'How much did it cost?'"
text = "அதற்கு நீங்கள் எவ்வளவு பணம் கொடுத்தீர்கள்?"

[lines."premium.reask"]
design = "§5 step 6 and the one-re-ask rule"
text = "அதாவது, அந்தப் பொருளின் தொகை எவ்வளவு? நினைவில் இருக்கும் அளவு சொல்லுங்கள்."

[lines."premium.say_again"]
design = "§6 two readings: they disagreed, so the customer is asked for the amount once more before any read-back"
text = "தொகையை இன்னொரு முறை சொல்லுங்கள், சரியாகக் குறித்துக்கொள்ள. எவ்வளவு கொடுத்தீர்கள்?"

[lines."payment_source.ask"]
design = "§5 step 6 'How was it paid?', asked open so neither source is suggested"
text = "அந்தப் பணம் எங்கிருந்து, எப்படிச் செலுத்தப்பட்டது?"

[lines."payment_source.reask"]
design = "§5 step 6 and the one-re-ask rule"
text = "அதாவது, அந்தப் பொருளுக்கான பணத்தை நீங்கள் எப்படிக் கட்டினீர்கள்?"

[lines."payment_frequency.ask"]
design = "P3a contract §3: one payment or more to come; both named, neither suggested"
text = "இந்தப் பணம் ஒரே ஒரு முறை கொடுக்க வேண்டியதா, அல்லது மீண்டும் மீண்டும் கொடுக்க வேண்டுமா?"

[lines."payment_frequency.reask"]
design = "P3a contract §3 and the one-re-ask rule"
text = "அதாவது, ஒரு முறை கொடுத்தீர்களா, அல்லது தொடர்ந்து கொடுக்க வேண்டுமா?"

[lines."required_for_loan.ask"]
design = "§5 step 6 'Was it required for the loan?': both possibilities named, then what the customer was told"
text = "கடன் கிடைக்க அதை வாங்குவது கட்டாயமா, அல்லது உங்கள் விருப்பமா? உங்களிடம் என்ன சொல்லப்பட்டது?"

[lines."required_for_loan.reask"]
design = "§5 step 6 and the one-re-ask rule"
text = "அதாவது, அதை வாங்காவிட்டால் கடன் பற்றி உங்களிடம் என்ன சொல்லப்பட்டது?"

[lines."provider_choice.ask"]
design = "§5 step 6 'Were you told you could buy this from another company?', asked open"
text = "அதை எங்கிருந்து வாங்க வேண்டும் என்பது பற்றி உங்களிடம் என்ன சொல்லப்பட்டது?"

[lines."provider_choice.reask"]
design = "§5 step 6 and the one-re-ask rule: both possibilities named"
text = "அதாவது, அதை வேறு இடத்திலும் வாங்கலாமா கூடாதா என்று யாராவது சொன்னார்களா?"

[lines."cover.ask"]
design = "§5 step 6 'What does it cover?', without the word that would name the product"
text = "அதனால் உங்களுக்கு என்ன கிடைக்கும், எவ்வளவு தொகை வரை?"

[lines."cover.reask"]
design = "§5 step 6 and the one-re-ask rule"
text = "அதாவது, அந்தப் பொருள் உங்களுக்கு எதற்குப் பயன்படும்? புரிந்ததைச் சொல்லுங்கள்."

[lines."cover.say_again"]
design = "§6 two readings, applied to the cover figure: they disagreed, so the amount is asked for once more"
text = "அந்தத் தொகையை இன்னொரு முறை சொல்லுங்கள். எவ்வளவு வரை கிடைக்கும்?"

[lines."term.ask"]
design = "§5 step 6 '... and for how long?'"
text = "அது எவ்வளவு காலத்துக்கு?"

[lines."term.reask"]
design = "§5 step 6 and the one-re-ask rule"
text = "அதாவது, அது எதுவரை நீடிக்கும்? மாதம் அல்லது வருடத்தில் சொல்லுங்கள்."

[lines."cancel_window.ask"]
design = "§5 step 6 'Were you told whether you can cancel, and by when?'; the bot never states a right (correction 11)"
text = "அதை ரத்து செய்ய முடியுமா முடியாதா என்று உங்களிடம் சொல்லப்பட்டதா? முடியும் என்றால், எதுவரை?"

[lines."cancel_window.reask"]
design = "§5 step 6 and the one-re-ask rule; still states no right"
text = "அதாவது, அதை நிறுத்துவது அல்லது திருப்பிக் கொடுப்பது பற்றி உங்களிடம் என்ன சொல்லப்பட்டது?"

[lines."features.ask"]
design = "the money-back probe the rule engine needs (W1 report §7 decision 1; award BNG-L-041-1617-0797)"
text = "இந்தப் பணத்தை நீங்கள் திரும்பப் பெற விரும்பினால், என்ன நடக்கும்? உங்கள் புரிதலில் சொல்லுங்கள்."

[lines."features.reask"]
design = "the money-back probe and the one-re-ask rule"
text = "அதாவது, அதில் போட்ட பணத்துக்கு இனிமேல் என்ன ஆகும்? உங்களுக்குத் தெரிந்ததைச் சொல்லுங்கள்."

[lines."consent.ask"]
design = "§5 step 7: what the customer agreed to buy and how (correction 12); the call never captures consent"
text = "கடன் வாங்கும்போது எவற்றை வாங்க ஒப்புக்கொண்டீர்கள், எப்படி ஒப்புதல் கொடுத்தீர்கள்?"

[lines."consent.reask"]
design = "§5 step 7 and the one-re-ask rule"
text = "அதாவது, எவற்றுக்கு நீங்கள் சரி என்று சொன்னீர்கள், அந்தச் சரியை எந்த முறையில் சொன்னீர்கள்?"

[lines."read_back.confirm"]
design = "§5 step 8: the amount the customer said is read back in words and digits"
text = "நீங்கள் சொன்ன தொகை: {amount_words}. இது சரியா?"

[lines."read_back.confirm_about"]
design = "§5 step 8 for an amount said as 'about X' or 'X to Y': read back as said (P3a contract §4)"
text = "நீங்கள் சொன்ன தொகை சுமார் {amount_words}. இது சரியா?"

[lines."read_back.cover_confirm"]
design = "coordinator decision (iteration 2): a cover figure the customer stated is read back and confirmed, like the premium; never the record's"
text = "நீங்கள் சொன்ன தொகை: {amount_words}. இது சரியா?"

[lines."read_back.reconfirm"]
design = "§5 step 8 after an unclear reply"
text = "இன்னொரு முறை: {amount_words}. இது சரியா, இல்லையா?"

[lines."read_back.restate"]
design = "§5 step 8: the customer said the figure is wrong and gave no other"
text = "சரி. அப்படியென்றால் சரியான தொகை என்ன?"

[lines."bridge.moving_on"]
design = "§5: an answer still unclear after one re-ask is recorded and the call moves on; the bot never argues"
text = "பரவாயில்லை, அடுத்ததற்குப் போகலாம்."

[lines."stop_check.decline"]
design = "§5 step 2: a weak sign the customer wants to stop is checked with one question, never argued with"
text = "தொடர்ந்து பேசலாமா?"

[lines."stop_check.human"]
design = "§5 step 2: the customer can ask for a human; a weak signal is checked with one question"
text = "எங்கள் குழுவில் ஒருவர் உங்களிடம் பேச வேண்டும் என்று விரும்புகிறீர்களா?"

[lines."stop_check.disengaged"]
design = "§5: two unusable replies or three 'don't know' in a row get one 'ask on, or stop here?'"
text = "இன்னும் கேட்கட்டுமா, அல்லது இங்கேயே நிறுத்தட்டுமா?"

[lines."callback.when"]
design = "§5 step 2: the customer can stop; one who asks for a later call is asked when, once"
text = "சரி. உங்களை எப்போது அழைக்கலாம்?"

[lines."end.third_party"]
design = "§5 step 1: someone who is not the borrower, or never says they are, hears only who the call was for"
text = "இது {first_name} அவர்களுக்கான வாடிக்கையாளர் சேவை அழைப்பு. பிறகு மீண்டும் முயற்சிக்கிறோம். நன்றி, வணக்கம்."

[lines."end.neutral"]
design = "§5 step 1: wrong person or no confirmation, the bot ends and says nothing about a loan"
text = "பரவாயில்லை. தொந்தரவுக்கு மன்னிக்கவும். வணக்கம்."

[lines."end.check_failed"]
design = "§5 step 3: the check did not pass, so the loan is never mentioned"
text = "மன்னிக்கவும், இப்போது உறுதிப்படுத்த முடியவில்லை, அதனால் இந்த அழைப்பு இத்துடன் முடிகிறது. தேவைப்பட்டால் {lender} வாடிக்கையாளர் சேவையைத் தொடர்பு கொள்ளலாம். நன்றி."

[lines."end.declined"]
design = "§5 step 2: the customer can decline or stop at any time; no persuasion"
text = "சரி, பரவாயில்லை. உங்கள் நேரத்திற்கு நன்றி. வணக்கம்."

[lines."end.human"]
design = "§5 step 2: the customer can ask for a human"
text = "சரி. இது குறித்து வைக்கப்பட்டது. எங்கள் குழுவில் ஒருவர் உங்களைத் தொடர்பு கொள்வார். நன்றி, வணக்கம்."

[lines."end.call_back"]
design = "§5 step 2: the customer asked for another time; no time is promised"
text = "சரி, பிறகு அழைக்க முயற்சிக்கிறோம். நன்றி, வணக்கம்."

[lines."end.language"]
design = "§5, W4: the customer asked for a language the call has no lines for, or past the switch limit; the call ends and a call in that language is tried later (not human-reviewed)"
text = "மன்னிக்கவும், இந்த அழைப்பை இப்போது அந்த மொழியில் தொடர முடியாது. உங்கள் மொழியில் மீண்டும் அழைக்க முயற்சிக்கிறோம். நன்றி, வணக்கம்."

[lines."language.switched"]
design = "§5, W4: said in the new language when the call switches live, before the pending question is put again (not human-reviewed)"
text = "சரி, இனி தமிழில் பேசலாம்."

[lines."end.no_response"]
design = "§5: nothing heard twice in a row; the call ends and says nothing about a loan"
text = "குரல் கேட்கவில்லை. பிறகு மீண்டும் முயற்சிக்கிறோம். வணக்கம்."

[lines."end.do_not_call"]
design = "§5 step 2: the customer asked not to be called again; the call ends and records it"
text = "சரி, இனி அழைக்க வேண்டாம் என்பதைக் குறித்துக்கொண்டோம். நன்றி, வணக்கம்."

[lines."end.written"]
design = "§5 step 2: the customer asked for this in writing; the call ends and records it"
text = "சரி, இதை எழுத்து மூலம் வேண்டும் என்று குறித்துக்கொண்டோம். நன்றி, வணக்கம்."

[lines."close.thanks"]
design = "§5 step 9: thank you; no other product is mentioned"
text = "உங்கள் நேரத்திற்கும் பதில்களுக்கும் நன்றி."

[lines."close.may_call_back"]
design = "§5 step 9: the team may call back; no finding and no promise of money is stated"
text = "தேவைப்பட்டால் எங்கள் குழு உங்களை மீண்டும் அழைக்கலாம்."

[lines."close.verify"]
design = "§5 step 2, repeated at the close: how to check the call was genuine"
text = "இந்த அழைப்பு பற்றி சந்தேகம் இருந்தால், உங்கள் கடன் ஆவணங்களில் உள்ள {lender} வாடிக்கையாளர் சேவை எண்ணுக்கு அழைக்கலாம்."

[lines."close.bye"]
design = "§5 step 9"
text = "வணக்கம்."

[lines."consent.follow_what"]
design = "§9, W4: the one follow-up when the consent reply said only how; asks only what the yes was for (not human-reviewed)"
text = "அந்த சம்மதம் எதற்காகக் கொடுத்தீர்கள்?"

[lines."consent.follow_how"]
design = "§9, W4: the one follow-up when the consent reply said only what; asks only how, naming no way (not human-reviewed)"
text = "அந்த சம்மதத்தை எப்படிக் கொடுத்தீர்கள்?"

[lines."kind.follow_what"]
design = "§8, W4: the one follow-up when the kind reply gave a figure or what it does but no name for it (not human-reviewed)"
text = "அதை நீங்கள் என்னவென்று சொல்வீர்கள், அது என்ன?"

[lines."defer.reask"]
design = "§8, W4: said once before the re-ask when the customer defers to the lender or the record; asks for their own memory (not human-reviewed)"
text = "பதிவில் என்ன இருக்கிறது என்பதல்ல, உங்களுக்கே என்ன நினைவிருக்கிறது என்பதைத்தான் தெரிந்துகொள்ள விரும்புகிறோம்."
