# Samajh bot lines, Hinglish. Hindi words in Devanagari and English words in Latin script, the
# convention of data/amounts (Timbre voiced that mix in the pilots; these lines are not voiced yet).
# Slots: {first_name}, {lender}, {ordinal}; the read_back.* lines also take {amount_words} and
# {amount_digits}, which carry the figure the customer said, never a figure from the record.
# `design` names the DESIGN.md paragraph the line implements.

language = "hi-en"
review = "written by the build agent; no fluent second reviewer yet"
ordinals = ["पहली", "दूसरी", "तीसरी", "चौथी", "पाँचवीं"]

[lines."right_party.ask"]
design = "§5 step 1: confirm the first name; nothing else is said yet"
text = "Hello। क्या मेरी बात {first_name} जी से हो रही है?"

[lines."right_party.reask"]
design = "§5 step 1 and the one-re-ask rule (§5, A20): no lender, no loan"
text = "यह एक automated call है। क्या {first_name} जी line पर हैं?"

[lines."end.neutral"]
design = "§5 step 1: wrong person or no confirmation, the bot ends and says nothing about a loan"
text = "कोई बात नहीं। आपको disturb किया, sorry। नमस्ते।"

[lines."disclosure.who"]
design = "§5 step 2: the bank's name, customer-care team, automated AI assistant (recommended: FREE-AI report para 4.4.54)"
text = "Thank you। यह call {lender} की customer care team की तरफ़ से है। मैं एक automated A-I assistant हूँ, कोई इंसान नहीं।"

[lines."disclosure.not_sales"]
design = "§5 step 2: not a sales call, nothing will be offered (TCCCPR: promotional content would make it a promotional call)"
text = "यह sales call नहीं है। इस call में आपको कुछ भी sell नहीं किया जाएगा।"

[lines."disclosure.recording"]
design = "§5 step 2: feedback purpose, recorded to keep an accurate record (our choice), written notice (DPDP Act sections 5 and 6)"
text = "यह call सिर्फ़ आपका feedback लेने के लिए है। Feedback का सही record रहे, इसलिए call record हो रही है। आपका data कैसे use होता है, यह {lender} के written notice में दिया है।"

[lines."disclosure.rights"]
design = "§5 step 2: the customer can decline, stop at any time, or ask for a human"
text = "आप चाहें तो मना कर सकते हैं, call कभी भी रोक सकते हैं, या किसी इंसान से बात करने को कह सकते हैं।"

[lines."disclosure.verify"]
design = "§5 step 2: hang up and call the customer-care number on the papers to check the call is genuine (the loan is not named before step 4)"
text = "Call genuine है या नहीं, यह check करने के लिए आप phone रखकर {lender} के papers पर छपे customer care number पर call कर सकते हैं।"

[lines."disclosure.never_ask"]
design = "§5 step 2: the bot will never ask for an OTP, PIN, password or account number"
text = "इस call में आपसे O-T-P, PIN, password या account number कभी नहीं पूछा जाएगा।"

[lines."disclosure.go_ahead"]
design = "§5 step 2: the customer can decline, so the bot asks before going on"
text = "क्या हम आगे बढ़ें?"

[lines."disclosure.reask"]
design = "§5 step 2 and the one-re-ask rule (§5, A20)"
text = "यह {lender} की customer care team की automated feedback call है, sales call नहीं। क्या हम आगे बढ़ें? हाँ या नहीं में बताइए।"

[lines."second_check.ask"]
design = "§5 step 3: one low-sensitivity fact, the year of birth; never account digits"
text = "Thank you। Confirm करने के लिए बस अपना birth year बता दीजिए। सिर्फ़ year, पूरी date नहीं।"

[lines."second_check.reask"]
design = "§5 step 3 and the one-re-ask rule; the same line whether the year was unclear or did not match"
text = "Sorry, ठीक से सुनाई नहीं दिया। अपना birth year एक बार फिर बताइए।"

[lines."end.check_failed"]
design = "§5 step 3: the check did not pass, so the loan is never mentioned"
text = "Sorry, अभी confirm नहीं हो पाया, इसलिए यह call यहीं ख़त्म होती है। ज़रूरत हो तो आप {lender} के customer care से बात कर सकते हैं। Thank you।"

[lines."context.loan"]
design = "§5 step 4: only now does the bot mention the loan"
text = "Thank you। यह call उस loan के बारे में है जो आपने हाल ही में {lender} से लिया है।"

[lines."open_recall.ask"]
design = "§5 step 5: open recall before any product is named"
text = "Loan के साथ आपने और क्या-क्या लिया, और कितने का? अपने words में बताइए।"

[lines."open_recall.reask"]
design = "§5 step 5 and the one-re-ask rule: simpler words, still no product named"
text = "मतलब, loan लेते time उसके साथ आपको और कोई चीज़ दी गई थी क्या? जो भी याद हो, बताइए।"

[lines."teach_back.intro"]
design = "§5 step 6: the product is referred to without naming what it is"
text = "Thank you। अब loan के साथ ली गई चीज़ के बारे में कुछ छोटे questions हैं।"

[lines."teach_back.intro_nth"]
design = "§5 step 6, for a record with several products: an ordinal, not a name"
text = "अब loan के साथ record में दर्ज {ordinal} चीज़ के बारे में कुछ छोटे questions हैं।"

[lines."kind.ask"]
design = "§5 step 6 'Is this insurance, FD or something else?', asked open so no kind is suggested"
text = "आपकी समझ से वह चीज़ क्या है?"

[lines."kind.reask"]
design = "§5 step 6 and the one-re-ask rule"
text = "मतलब, loan के साथ जो चीज़ आपको मिली, उसे आप क्या बोलेंगे?"

[lines."premium.ask"]
design = "§5 step 6 'How much did it cost?'"
text = "उसके लिए आपने कितना amount pay किया?"

[lines."premium.reask"]
design = "§5 step 6 and the one-re-ask rule"
text = "मतलब, उस चीज़ का amount कितना था? जितना याद हो, उतना बताइए।"

[lines."payment_source.ask"]
design = "§5 step 6 'How was it paid?', asked open so neither source is suggested"
text = "वह payment कहाँ से और कैसे हुआ?"

[lines."payment_source.reask"]
design = "§5 step 6 and the one-re-ask rule"
text = "मतलब, उस चीज़ का पैसा आपने कैसे भरा?"

[lines."required_for_loan.ask"]
design = "§5 step 6 'Was it required for the loan?': both possibilities named, then what the customer was told"
text = "Loan मिलने के लिए वह चीज़ लेना ज़रूरी था या आपकी choice थी? आपको क्या बताया गया था?"

[lines."required_for_loan.reask"]
design = "§5 step 6 and the one-re-ask rule"
text = "मतलब, अगर आप वह चीज़ नहीं लेते, तो loan के बारे में आपको क्या बोला गया था?"

[lines."provider_choice.ask"]
design = "§5 step 6 'Were you told you could buy this from another company?', asked open"
text = "वह चीज़ कहाँ से लेनी है, इस बारे में आपको क्या बताया गया था?"

[lines."provider_choice.reask"]
design = "§5 step 6 and the one-re-ask rule: both possibilities named"
text = "मतलब, क्या किसी ने बताया था कि वह चीज़ आप कहीं और से भी ले सकते हैं या नहीं?"

[lines."cover.ask"]
design = "§5 step 6 'What does it cover?', without the word that would name the product"
text = "उस चीज़ से आपको क्या मिलता है, और कितने amount तक?"

[lines."cover.reask"]
design = "§5 step 6 and the one-re-ask rule"
text = "मतलब, वह चीज़ आपके किस काम आती है? जो समझ में आया हो, बताइए।"

[lines."term.ask"]
design = "§5 step 6 '... and for how long?'"
text = "वह कितने time के लिए है?"

[lines."term.reask"]
design = "§5 step 6 and the one-re-ask rule"
text = "मतलब, वह चीज़ कब तक चलेगी? Months या years में बताइए।"

[lines."cancel_window.ask"]
design = "§5 step 6 'Were you told whether you can cancel, and by when?'; the bot never states a right (correction 11)"
text = "क्या आपको बताया गया था कि वह चीज़ आप cancel कर सकते हैं या नहीं, और अगर हाँ, तो कब तक?"

[lines."cancel_window.reask"]
design = "§5 step 6 and the one-re-ask rule; still states no right"
text = "मतलब, उसे बंद या वापस करने के बारे में आपको क्या बताया गया था?"

[lines."features.ask"]
design = "the money-back probe the rule engine needs (W1 report §7 decision 1; award BNG-L-041-1617-0797)"
text = "अगर आप यह पैसा वापस लेना चाहें, तो क्या होगा? अपनी समझ से बताइए।"

[lines."features.reask"]
design = "the money-back probe and the one-re-ask rule"
text = "मतलब, उस चीज़ में लगे पैसे का आगे क्या होता है? जो आपको पता हो, बताइए।"

[lines."consent.ask"]
design = "§5 step 7: what the customer agreed to buy and how (correction 12); the call never captures consent"
text = "Loan लेते time आपने क्या-क्या लेने के लिए हाँ बोला था, और हाँ किस तरह बोला था?"

[lines."consent.reask"]
design = "§5 step 7 and the one-re-ask rule"
text = "मतलब, आपने किन चीज़ों के लिए agree किया था, और किस तरीक़े से agree किया था?"

[lines."read_back.intro_nth"]
design = "§5 step 8, for a record with several products"
text = "अब {ordinal} चीज़ का amount।"

[lines."read_back.confirm"]
design = "§5 step 8: the amount the customer said is read back in words and digits"
text = "आपने बताया था {amount_words}, यानी {amount_digits}। क्या यह सही है?"

[lines."read_back.reconfirm"]
design = "§5 step 8 after an unclear reply"
text = "एक बार फिर: {amount_words}, यानी {amount_digits}। यह सही है या नहीं?"

[lines."read_back.restate"]
design = "§5 step 8: the customer said the figure is wrong and gave no other"
text = "ठीक है। तो सही amount क्या है?"

[lines."bridge.moving_on"]
design = "§5: an answer still unclear after one re-ask is recorded and the call moves on; the bot never argues"
text = "कोई बात नहीं, आगे बढ़ते हैं।"

[lines."stop_check.decline"]
design = "§5 step 2: the customer can stop at any time; a weak signal is checked with one question, never argued with"
text = "क्या आप यह call यहीं stop करना चाहते हैं?"

[lines."stop_check.human"]
design = "§5 step 2: the customer can ask for a human; a weak signal is checked with one question"
text = "क्या आप चाहते हैं कि हमारी team से कोई person आपसे बात करे?"

[lines."end.declined"]
design = "§5 step 2: the customer can decline or stop at any time; no persuasion"
text = "ठीक है, कोई problem नहीं। आपके time के लिए thank you। नमस्ते।"

[lines."end.human"]
design = "§5 step 2: the customer can ask for a human"
text = "ठीक है। यह note कर लिया गया है। हमारी team से कोई आपको contact करेगा। Thank you, नमस्ते।"

[lines."close.thanks"]
design = "§5 step 9: thank you; no other product is mentioned"
text = "आपके time और जवाबों के लिए thank you।"

[lines."close.may_call_back"]
design = "§5 step 9: the team may call back; no finding and no promise of money is stated"
text = "ज़रूरत पड़ने पर हमारी team आपको दोबारा call कर सकती है।"

[lines."close.bye"]
design = "§5 step 9"
text = "नमस्ते।"
