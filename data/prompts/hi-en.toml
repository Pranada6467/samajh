# Samajh bot lines, Hinglish (Hindi with English words, as spoken in Indian customer care).
# Data, not code: samajh/dialogue/prompts.py loads and checks this file.
# Slots: {first_name}, {lender}, {ordinal}; the read_back.* lines also take {amount_words} (and,
# except confirm_about, {amount_digits}), which carry the figure the customer said, never a figure
# from the record. `design` names the DESIGN.md paragraph the line implements.
# Call v2 (iteration 2, P2): opening cut to four short lines, natural-register pass, new branches.

language = "hi-en"
review = "written by the build agent, call v2 register pass by the P2 builder; no fluent human reviewer yet"
ordinals = ["पहली", "दूसरी", "तीसरी", "चौथी", "पाँचवीं"]
range_word = "से"

[lines."right_party.ask"]
design = "§5 step 1: confirm the first name; nothing else is said yet"
text = "Hello, क्या आप {first_name} जी हैं?"

[lines."right_party.reask"]
design = "§5 step 1 and the one-re-ask rule: asks whether the speaker is the borrower, not whether he is there; no lender, no loan"
text = "यह {first_name} जी के लिए एक automated customer care call है। क्या आप ख़ुद {first_name} जी बोल रहे हैं?"

[lines."purpose.before_confirm"]
design = "§5 step 1: 'what is this about?' before anyone has claimed to be the borrower; no lender, no loan"
text = "यह एक customer care feedback call है; बाक़ी बात सही person से बात confirm होने के बाद।"

[lines."disclosure.who"]
design = "§5 step 2: the bank's name, customer care, an automated assistant (FREE-AI report para 4.4.54)"
text = "मैं {lender} customer care से computer से चलने वाली आवाज़ हूँ, इंसान नहीं।"

[lines."disclosure.not_sales"]
design = "§5 step 2: not a sales call (TCCCPR), and its purpose, feedback (DPDP Act s.5)"
text = "यह sales नहीं, feedback call है।"

[lines."disclosure.recording"]
design = "§5 step 2: recorded (our choice), with the pointer to the written notice (DPDP Act ss.5-6)"
text = "बातचीत record हो रही है; जानकारी {lender} के written notice में है।"

[lines."disclosure.go_ahead"]
design = "§5 step 2: the customer can decline, so the bot asks before going on"
text = "क्या दो-तीन minute बात करें?"

[lines."disclosure.reask"]
design = "§5 step 2 and the one-re-ask rule"
text = "यह {lender} की feedback call है, sales call नहीं। क्या अभी दो-तीन minute बात करें? बस हाँ या ना कह दीजिए।"

[lines."disclosure.never_ask"]
design = "§5 step 2: never an OTP, PIN, password or account number; said with the birth-year question, where it matters"
text = "हम आपसे कभी O-T-P, PIN, password या account number नहीं माँगेंगे।"

[lines."disclosure.rights"]
design = "§5 step 2: stop at any time or ask for a human; said with the first mention of the loan"
text = "रुकना हो या किसी इंसान से बात करनी हो, तो कभी भी बोल दीजिए।"

[lines."verify.before_loan"]
design = "§5 step 2: how to check the call is genuine, on request before the loan is named; never names the loan"
text = "यह {lender} customer care की feedback call है; किस बारे में है, यह birth year confirm होने के बाद बताएँगे। Doubt हो तो phone रखकर {lender} customer care पर ख़ुद पूछ लीजिए। हम कभी O-T-P या PIN नहीं माँगते।"

[lines."verify.after_loan"]
design = "§5 step 2: how to check the call is genuine, on request after the loan is named"
text = "यह call {lender} से लिए आपके हाल के loan के बारे में कुछ छोटे questions के लिए है। Doubt हो तो phone रखकर loan papers पर छपे customer care number पर पूछ लीजिए। हम कभी O-T-P या PIN नहीं माँगते।"

[lines."verify.short"]
design = "§5 step 2: one short line on checking the call, said with the birth-year question (review round 2)"
text = "Doubt हो तो phone रखकर {lender} customer care पर ख़ुद पूछ सकते हैं।"

[lines."second_check.ask"]
design = "§5 step 3: one low-sensitivity fact, the year of birth; never account digits"
text = "Confirm करने के लिए, अपना birth year बता दीजिए। सिर्फ़ year।"

[lines."second_check.reask"]
design = "§5 step 3 and the one-re-ask rule; the same line whether the year was unclear or did not match, and it claims neither"
text = "एक बार फिर, सिर्फ़ अपना birth year बताइए।"

[lines."context.loan"]
design = "§5 step 4: only now does the bot mention the loan"
text = "Thank you। आपने हाल ही में {lender} से जो loan लिया, उसके बारे में कुछ questions हैं।"

[lines."open_recall.ask"]
design = "§5 step 5: open recall before any product is named; asks whether anything was taken instead of presupposing it"
text = "Loan के साथ आपने कुछ और भी लिया था क्या? अगर हाँ, तो क्या, और कितने का?"

[lines."open_recall.reask"]
design = "§5 step 5 and the one-re-ask rule: simpler words, still no product named"
text = "मतलब, loan लेते time उसके साथ कोई और चीज़ भी हुई थी क्या? जो याद हो, बताइए।"

[lines."open_recall.nothing"]
design = "§5 step 5: the customer said they took nothing; one neutral follow-up, then consent and close"
text = "Okay। Loan लेते time किसी ने आपसे loan के अलावा किसी और चीज़ की बात की थी?"

[lines."teach_back.intro"]
design = "§5 step 6: said only after the customer has named or affirmed something; refers to it, names nothing"
text = "ठीक है, उसके बारे में कुछ छोटे questions हैं।"

[lines."teach_back.intro_nth"]
design = "§5 step 6, for a record with several products: an ordinal, not a name"
text = "अब हमारे record में loan के साथ जो {ordinal} चीज़ है, उसके बारे में कुछ छोटे questions हैं।"

[lines."kind.ask"]
design = "§5 step 6 'Is this insurance, FD or something else?', asked open so no kind is suggested"
text = "वो क्या है? अपने words में बताइए।"

[lines."kind.reask"]
design = "§5 step 6 and the one-re-ask rule"
text = "मतलब, loan के साथ जो लिया, उसे आप क्या बोलेंगे?"

[lines."premium.ask"]
design = "§5 step 6 'How much did it cost?'"
text = "उसके लिए आपने कितना pay किया?"

[lines."premium.reask"]
design = "§5 step 6 and the one-re-ask rule"
text = "मतलब, उसका amount कितना था? जितना याद हो, उतना बताइए।"

[lines."premium.say_again"]
design = "§6 two readings: they disagreed, so the customer is asked for the amount once more before any read-back"
text = "Amount एक बार और बता दीजिए, ताकि सही note हो। कितना pay किया?"

[lines."payment_source.ask"]
design = "§5 step 6 'How was it paid?', asked open so neither source is suggested"
text = "वो payment कहाँ से और कैसे हुई?"

[lines."payment_source.reask"]
design = "§5 step 6 and the one-re-ask rule"
text = "मतलब, उसका पैसा किस तरह भरा गया?"

[lines."payment_frequency.ask"]
design = "P3a contract §3: one payment or more to come; both named, neither suggested"
text = "यह payment एक ही बार की थी, या आगे भी करनी होगी?"

[lines."payment_frequency.reask"]
design = "P3a contract §3 and the one-re-ask rule"
text = "मतलब, उसके लिए एक बार pay किया, या बार-बार pay करना है?"

[lines."required_for_loan.ask"]
design = "§5 step 6 'Was it required for the loan?': what the customer was told, both possibilities named"
text = "आपको क्या बताया गया था: loan के लिए यह लेना ज़रूरी है, या आपकी choice है?"

[lines."required_for_loan.reask"]
design = "§5 step 6 and the one-re-ask rule; keeps the same two choices in the same order"
text = "मतलब, आपसे बोला गया था कि यह लेना ही पड़ेगा, या बोला गया कि आपकी choice है?"

[lines."provider_choice.ask"]
design = "§5 step 6 'Were you told you could buy this from another company?'; skipped when the customer said it was their own choice"
text = "क्या आपको बताया गया था कि यह आप कहीं और से भी ले सकते हैं, या नहीं?"

[lines."provider_choice.reask"]
design = "§5 step 6 and the one-re-ask rule"
text = "मतलब, क्या किसी ने बोला था कि यह आप किसी दूसरी जगह से भी ले सकते हैं?"

[lines."cover.ask"]
design = "§5 step 6 'What does it cover?', without the word that would name the product"
text = "उससे आपको क्या मिलता है? कोई amount जुड़ा हो, तो वो भी बताइए।"

[lines."cover.reask"]
design = "§5 step 6 and the one-re-ask rule"
text = "मतलब, वो आपके किस काम आता है? जो समझ में आया हो, बताइए।"

[lines."cover.say_again"]
design = "§6 two readings, applied to the cover figure: they disagreed, so the amount is asked for once more"
text = "वो amount एक बार और बता दीजिए, ताकि सही note हो। उससे कितने तक का मिलता है?"

[lines."term.ask"]
design = "§5 step 6 '... and for how long?'"
text = "वो कितने time के लिए है?"

[lines."term.reask"]
design = "§5 step 6 and the one-re-ask rule"
text = "मतलब, वो कब तक चलेगा? Months या years में बताइए।"

[lines."cancel_window.ask"]
design = "§5 step 6 'Were you told whether you can cancel, and by when?', asked open; the bot never states a right (correction 11)"
text = "उसे बंद या cancel कराने के बारे में आपको क्या बताया गया था?"

[lines."cancel_window.reask"]
design = "§5 step 6 and the one-re-ask rule; still states no right"
text = "मतलब, क्या बताया गया था कि उसे cancel करा सकते हैं, और कब तक?"

[lines."features.ask"]
design = "the money-back probe the rule engine needs (W1 report §7 decision 1; award BNG-L-041-1617-0797)"
text = "अगर आप उसमें लगे पैसे वापस चाहें, तो क्या होगा? आपको क्या लगता है?"

[lines."features.reask"]
design = "the money-back probe and the one-re-ask rule"
text = "मतलब, उसमें लगे पैसे का आगे क्या होता है? जो पता हो, बताइए।"

[lines."consent.ask"]
design = "§5 step 7: what the customer agreed to and how (correction 12); the call never captures consent"
text = "Loan लेते time आपने किन-किन चीज़ों के लिए हाँ बोला था? और वो हाँ आपने किस तरह दी थी?"

[lines."consent.reask"]
design = "§5 step 7 and the one-re-ask rule"
text = "मतलब, आपसे किस चीज़ के लिए हाँ ली गई, और वो हाँ आपने किस तरह दी थी?"

[lines."read_back.confirm"]
design = "§5 step 8: straight after the premium answer, the customer's figure in words and digits, and what it is for"
text = "तो आपने उसके लिए {amount_words} rupees pay किए। सही है?"

[lines."read_back.confirm_about"]
design = "§5 step 8 for an amount said as 'about X' or 'X to Y': read back as said (P3a contract §4)"
text = "तो आपने उसके लिए लगभग {amount_words} rupees pay किए। सही है?"

[lines."read_back.cover_confirm"]
design = "coordinator decision (iteration 2): a cover figure the customer stated is read back and confirmed, like the premium; never the record's"
text = "तो उससे {amount_words} rupees तक मिलता है। सही है?"

[lines."read_back.reconfirm"]
design = "§5 step 8 after an unclear reply, or when two readings of the reply disagree"
text = "एक बार फिर: {amount_words} rupees। यह सही है या नहीं?"

[lines."read_back.restate"]
design = "§5 step 8: the customer said the figure is wrong and gave no other"
text = "ठीक है। तो सही amount कितना है?"

[lines."bridge.moving_on"]
design = "§5: an answer still unclear after one re-ask is recorded and the call moves on; the bot never argues"
text = "कोई बात नहीं, आगे बढ़ते हैं।"

[lines."stop_check.decline"]
design = "§5 step 2: a weak sign the customer wants to stop is checked with one question, never argued with"
text = "क्या मैं आगे बढ़ूँ?"

[lines."stop_check.human"]
design = "§5 step 2: the customer can ask for a human; a weak signal is checked with one question"
text = "क्या आप हमारी team के किसी व्यक्ति से बात करना चाहेंगे?"

[lines."stop_check.disengaged"]
design = "§5: two unusable replies or three 'don't know' in a row get one 'ask on, or stop here?'"
text = "क्या मैं आगे पूछूँ, या यहीं रोक दूँ?"

[lines."callback.when"]
design = "§5 step 2: the customer can stop; one who asks for a later call is asked when, once"
text = "ठीक है। आपको कब call करें?"

[lines."end.third_party"]
design = "§5 step 1: someone who is not the borrower, or never says they are, hears only who the call was for"
text = "हम {first_name} जी से बाद में बात कर लेंगे। Thank you।"

[lines."end.neutral"]
design = "§5 step 2: no clear yes to going ahead; the bot ends and says nothing about a loan"
text = "कोई बात नहीं। Disturb करने के लिए sorry। नमस्ते।"

[lines."end.check_failed"]
design = "§5 step 3: the check did not pass, so the loan is never mentioned"
text = "Sorry, अभी confirm नहीं हो पाया, इसलिए call यहीं end करते हैं। ज़रूरत हो तो आप {lender} customer care से बात कर सकते हैं। Thank you।"

[lines."end.declined"]
design = "§5 step 2: the customer can decline or stop at any time; no persuasion"
text = "ठीक है, कोई problem नहीं। आपके time के लिए thank you। नमस्ते।"

[lines."end.human"]
design = "§5 step 2: the customer can ask for a human"
text = "ठीक है, यह note कर लिया है। हमारी team का कोई व्यक्ति आपको contact करेगा। Thank you, नमस्ते।"

[lines."end.call_back"]
design = "§5 step 2: the customer asked for another time; no time is promised"
text = "ठीक है, हम बाद में call करने की कोशिश करेंगे। Thank you, नमस्ते।"

[lines."end.language"]
design = "§5: the customer asked for another language; the call does not switch live"
text = "ठीक है, हम आपकी language में दोबारा call करने की कोशिश करेंगे। Thank you, नमस्ते।"

[lines."end.no_response"]
design = "§5: nothing heard twice in a row; the call ends and says nothing about a loan"
text = "आवाज़ नहीं आ रही है। हम बाद में फिर try करेंगे। नमस्ते।"

[lines."end.do_not_call"]
design = "§5 step 2: the customer asked not to be called again; the call ends and records it"
text = "ठीक है, आगे call न करने की बात note कर ली है। Thank you, नमस्ते।"

[lines."end.written"]
design = "§5 step 2: the customer asked for this in writing; the call ends and records it"
text = "ठीक है, यह note कर लिया है कि आप यह written में चाहते हैं। Thank you, नमस्ते।"

[lines."close.thanks"]
design = "§5 step 9: thank you; no other product is mentioned"
text = "आपके time और जवाबों के लिए thank you।"

[lines."close.may_call_back"]
design = "§5 step 9: the team may call back; no finding and no promise of money is stated"
text = "ज़रूरत पड़ने पर हमारी team आपको दोबारा call कर सकती है।"

[lines."close.verify"]
design = "§5 step 2, repeated at the close: how to check the call was genuine"
text = "कोई doubt हो, तो loan papers पर छपे {lender} customer care number पर पूछ सकते हैं।"

[lines."close.bye"]
design = "§5 step 9"
text = "नमस्ते।"
