[project]
name = "samajh"
version = "0.1.0"
description = "Post-sale understanding callback for Indian lenders (RBI 85Y), built on Gnani Prisma STT and Timbre TTS"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "httpx>=0.27",
    "filelock>=3.15",
    "python-dotenv>=1.0",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "python-multipart>=0.0.9",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "respx>=0.21",
    "huggingface-hub>=2.4.0",
    "datasets>=5.2.0",
    "soundfile>=0.14.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["samajh"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: calls a real external API (costs credits); deselected by default"]
addopts = "-m 'not live'"

[tool.ruff]
line-length = 110
