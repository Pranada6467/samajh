# Settings of the voice transport. `SAMAJH_SERVER_SETTINGS` names another file to load instead.
# Nothing here was set on human audio: no person has used the phone yet.

[tts]
model = "timbre-v3.0"

# The bot's voice, one per call language (samajh.types.Language values). Timbre v3.0 voices are
# not tied to a language. Shivani is the one voice this project has run end to end: in the
# iteration 1 call Prisma Batch labelled her and a male customer voice as two speakers (n = 1).
# Nobody has compared the voices by ear, so this is a default and not a judgement of quality.
[tts.voice]
hi = "Shivani"
hi-en = "Shivani"
ta = "Shivani"
kn = "Shivani"

[stt]
model = "prisma-v3.0"
format = "transcribe"
# The second reading of a turn that may carry a figure. The two calls run one after the other
# (the key allows one request at a time). v2.5 answered in a median 0.2 s on short clips and its
# 504s arrived after about 5 s, so a reading that is not back in time is counted as missing.
second_model = "prisma-v2.5"
second_format = "transcribe"
second_timeout_s = 2.5

# How long the phone waits through silence, by the kind of reply the bot asked for.
#   cut_ms    silence after which the phone sends the turn so far.
#   grace_ms  time after the last voiced frame in which the customer can still go on. The bot's
#             next line does not start before it has passed. If the customer resumes, the phone
#             sends the whole turn again as a later take and the server reads it afresh.
# The verifier saw a 700 ms cut split answers at a 600 ms pause in Chrome, so open questions get
# more patience than yes/no questions. Set these on human pauses once some are recorded (each
# turn's pauses are in the session log).
[turn_taking.yes_no]
cut_ms = 700
grace_ms = 1000

[turn_taking.short]
cut_ms = 800
grace_ms = 1200

[turn_taking.amount]
cut_ms = 1000
grace_ms = 1600

[turn_taking.open]
cut_ms = 1100
grace_ms = 1800

# The dialogue's LLM second opinion for a live turn its word lists cannot place. It runs inside
# the turn, so it gets a short timeout and one attempt; when it fails the turn is read as unclear.
[fallback]
enabled = true
timeout_s = 3.0

# The lender's right-party check (samajh.identity; references/pilots/P8-contract.md section 1). Only
# the menu: second_check is "none" or "year_of_birth"; attempts 1 or 2 (ignored with "none").
# prior_notice: a written message before the call (the demo shows it mocked; nothing is sent).
# call_back_line: the spoken "hang up and call the customer-care number on your papers" line.
# A session request may carry its own `identity` (the phone's demo picker), checked the same way.
[identity]
second_check = "none"
attempts = 1
prior_notice = true
call_back_line = true

# After the call: Prisma Batch on the whole recording, for segment times and speaker labels.
# Two speakers: the bot and the person who answered.
[batch]
model = "prisma-v3.0"
num_speakers = 2
timeout_s = 600

# Bot lines made before they are needed. The key allows ONE REST request at a time, shared by STT
# and TTS, and a line made on the call costs about 1 s of the customer's wait, one after another
# (22 of 35 lines in the practice calls). At start the server makes every line that names no
# customer (no slot, or only the lender and an ordinal) and the first-name lines of every record
# in the record book, for these languages and line rates, and refuses to start if one cannot be
# made. A session whose first-name lines are not cached (a loan-book loan) makes them inside its
# create, before the response (at most about 8 s). Nothing is synthesised in the background.
[prewarm]
enabled = true
languages = ["hi", "hi-en", "ta", "kn"]
line_rates = [8000]
# The most a start may spend (estimated credits) making missing lines; over it the server refuses
# to start and names the `prompts build` command to run by hand.
max_credits = 40

# Prisma WebSocket streaming for the primary reading of a customer turn (samajh.server.stream).
# OFF by default: how streaming is billed is unknown (no API surface reports cost), and it has
# been measured on TTS clips only. A stream does not hold the account's one REST slot, so when on
# it frees that slot for the bot's lines and the v2.5 second reading. Any streaming failure falls
# back to the REST primary, marked `stream_fallback` in the session log.
#   min_silence_ms      the server-side cut; the phone's VAD commits, so it is set long (2,000 ms
#                       kept 600 and 1,000 ms pauses in one segment; the 500 ms default split them).
#   commit_timeout_s    how long a commit, and the turn, wait for the final transcript.
#   max_stream_seconds  streamed audio seconds over all `stt.stream` ledger rows; then no stream opens.
[streaming]
enabled = false
model = "prisma-v3.0"
min_silence_ms = 2000
commit_timeout_s = 1.5
max_stream_seconds = 3000
