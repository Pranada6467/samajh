# The written notice sent before a Samajh call (P8 contract section 6), Hinglish. MOCKED: the demo
# shows it as a card; no message is ever sent. Data, not code: samajh/identity/notice.py loads and
# checks it (the bot-line bans, no loan or product word, no digit: the number series is the
# {series} slot, which the code fills with 1600). Slots: {lender}, {series}. It names the lender
# and never the borrower, the loan or a product: a message can be read on a locked screen.

language = "hi-en"
review = "written by the build agent; no fluent human reviewer yet"

[[parts]]
name = "who"
text = "{lender} की तरफ़ से: अगले कुछ दिनों में हम आपको एक short feedback call करेंगे।"

[[parts]]
name = "automated"
text = "Call पर एक automated computer voice बात करेगी, इंसान नहीं।"

[[parts]]
name = "not_sales"
text = "यह sales call नहीं है।"

[[parts]]
name = "number"
text = "Call {series} से शुरू होने वाले number से आएगी।"

[[parts]]
name = "never_ask"
text = "हम कभी OTP, PIN या password नहीं माँगेंगे।"

[[parts]]
name = "check"
text = "Doubt हो तो phone रखकर अपने papers पर छपे {lender} customer care number पर ख़ुद call करके check करें।"
