# Measured client defaults (credit rates, default model ids). Every value here comes from a
# measurement or a verified source; note which next to it.

[gnani]
# Estimate, not a published price: no API surface reports cost. Derived from one dashboard reading
# after a pilot (2.96 credits for 78 STT calls of about 2.5 s and 20 TTS calls of about 34
# characters, split roughly 1.7 STT / 1.2 TTS): about 0.0087 credits per audio second and 0.0018
# per character, rounded up here so the guard errs towards refusing.
stt_credits_per_second = 0.010
tts_credits_per_char = 0.002
# Project rule, not a measurement: total credits this project may spend.
credit_cap = 1000

[llm]
# Recommended for extraction by references/pilots/W5-extractor-report.md section 2.4 (2026-11-10):
# development set (n=20 calls, in-sample for the prompt) 20/20 call verdicts and 0/7 false alarms,
# against 17/20 and 3/7 for the previous default mistralai/mistral-small-3.2-24b-instruct; negation
# probe 24/24 against 20/24. About 1.9 times the cost per transcript ($0.00153 against $0.00081) and
# slower (median 1.87 s per call against 0.82 s). It is a reasoning model: a small max_tokens can
# come back cut off and empty (same report, "Two caveats").
model = "openai/gpt-6-luna"
# Project rule, not a measurement: per-run (per client instance) spend cap in USD.
usd_cap = 1.0

# Which sampling parameters a request carries, by model id. A parameter not listed for a model is
# left out of the request (and so out of the cache key) whatever the caller passes. The longest
# matching prefix wins; a model that matches none gets `default`.
[llm.sampling]
default = ["temperature"]

[llm.sampling.by_model_prefix]
# Verified live (W5-extractor-report.md section 3): OpenRouter answers 404 "No endpoints found that
# can handle the requested parameters" when `temperature` is sent, and 200 without it.
"openai/gpt-6-luna" = []
